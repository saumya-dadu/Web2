server.port=8080

# H2 in file mode: data survives restarts when /data is a volume (override path with H2_DB_PATH)
spring.datasource.url=jdbc:h2:file:${H2_DB_PATH:./data/joineedb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.pattern.console=%d{HH:mm:ss} %-5level %logger{15} - %msg%n
