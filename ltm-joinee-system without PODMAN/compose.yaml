# Works with:  podman compose up -d --build     (or: podman-compose up -d --build)
name: ltm-joinee-system

services:
  backend:                       # <- this service name is the DNS hostname used by nginx ("http://backend:8080")
    build:
      context: ./backend
    image: localhost/ltm-backend:1.0
    container_name: ltm-backend
    environment:
      H2_DB_PATH: /data/joineedb
    volumes:
      - joinee-data:/data        # H2 database files survive container restarts/recreation
    ports:
      - "127.0.0.1:8080:8080"    # OPTIONAL: lets you curl the backend directly from the host for debugging
    networks:
      - ltm-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: localhost/ltm-frontend:1.0
    container_name: ltm-frontend
    ports:
      - "3000:80"                # host:3000 -> container:80 (nginx). THIS is the URL you open in the browser.
    depends_on:
      - backend
    networks:
      - ltm-net
    restart: on-failure          # nginx exits if "backend" cannot be resolved yet; retry until it can

networks:
  ltm-net:
    driver: bridge

volumes:
  joinee-data:
